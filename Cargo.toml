[workspace]
resolver = "2"
members = ["crates/proto", "crates/capture", "crates/encode", "crates/host", "crates/input"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rd-proto = { path = "crates/proto" }
rd-capture = { path = "crates/capture" }
rd-encode = { path = "crates/encode" }

[profile.release]
debug = 1

# Pixel conversion and encoding are unusably slow without optimizations.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.rd-encode]
opt-level = 3
